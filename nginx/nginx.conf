worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Образ nginx-unprivileged работает с read-only ФС: временные файлы только в /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    server_tokens off;
    client_max_body_size 100M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Перед контейнером стоит nginx хоста (TLS) и docker-proxy, поэтому $remote_addr — адрес из
    # приватной сети. Настоящий IP клиента берём из X-Forwarded-For, доверяя только приватным адресам:
    # real_ip_recursive выбирает самый правый недоверенный адрес, подделка заголовка клиентом не помогает.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Ограничения частоты по IP клиента. Сверх лимита — 429, в лог nginx пишется warn.
    # burst — сколько запросов можно сделать сразу сверх ровного темпа, nodelay — без задержки очереди.
    limit_req_status 429;
    limit_req_log_level warn;

    # Пустой ключ nginx не считает: в лимит входа попадают только POST (попытки пароля),
    # открытие страницы входа не ограничивается.
    map $request_method $login_post_key {
        POST    $binary_remote_addr;
        default "";
    }

    # Вход в админку: 5 попыток в минуту (сразу до 6), то есть ~7000 паролей в сутки вместо миллионов.
    limit_req_zone $login_post_key     zone=admin_login:1m rate=5r/m;
    # Вся админка: с запасом для обычной работы, против перебора URL и долбёжки.
    limit_req_zone $binary_remote_addr zone=admin:1m       rate=10r/s;
    # Заявки уходят в Bitrix и Telegram: 2 в минуту (сразу до 4) — человеку хватает, флуду нет.
    limit_req_zone $binary_remote_addr zone=orders:1m      rate=2r/m;
    # Отзывы с фото: 3 в минуту (сразу до 3).
    limit_req_zone $binary_remote_addr zone=reviews:1m     rate=3r/m;
    # Остальное API (чтение страниц): страница делает 1–3 запроса, лимит только против долбёжки.
    limit_req_zone $binary_remote_addr zone=api:1m         rate=10r/s;

    upstream django {
        server django:8000;
    }

    server {
        listen 8080;

        # Общие заголовки для проксирования в Django (наследуются всеми location ниже).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /admin {
            limit_req zone=admin burst=50 nodelay;
            proxy_pass http://django;
        }

        # Отдельно от /admin: limit_req внутри location заменяет унаследованные, поэтому общий указан снова.
        location = /admin/login/ {
            limit_req zone=admin burst=50 nodelay;
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://django;
        }

        location /api/v1 {
            limit_req zone=api burst=30 nodelay;
            client_max_body_size 1m;
            proxy_pass http://django;
        }

        location = /api/v1/create_order/ {
            limit_req zone=orders burst=3 nodelay;
            client_max_body_size 1m;
            proxy_pass http://django;
        }

        # 5 фото по 5 МБ + текст. Большие загрузки (100M) остаются только у админки.
        location = /api/v1/create_review/ {
            limit_req zone=reviews burst=2 nodelay;
            client_max_body_size 30m;
            proxy_pass http://django;
        }

        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
